name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # The lowest version that bin/toolkit supports. Local runs cover
          # newer versions.
          python-version: "3.11"
      - name: Validate skills, config, and style file
        run: bin/toolkit check
      - name: Run tests
        run: python3 -m unittest discover -s tests
      - name: Check that the generated workflow files are current
        # examples.md and walkthroughs.html are generated from workflow/src/.
        # If this fails, run python3 workflow/src/build.py and commit.
        run: |
          python3 workflow/src/build.py
          git diff --exit-code -- workflow/examples.md workflow/walkthroughs.html
